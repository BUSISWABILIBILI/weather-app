<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <link rel="stylesheet" href="styles.css?v=20260521" />
  </head>

  <body>
    <div class="app">
      <header class="header">
        <div>
          <h1>Weather App</h1>
          <p>Search any city and view the weather forecast.</p>
        </div>

        <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
          <svg
            class="theme-icon sun-icon"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>

          <svg
            class="theme-icon moon-icon"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </header>

      <form class="search-form">
        <input
          type="text"
          id="city-input"
          placeholder="Enter a city..."
          required
        />

        <button type="submit">Search</button>
      </form>

      <p class="loading hidden">Loading weather data...</p>
      <p class="error-message hidden">City not found. Please try again.</p>

      <main class="weather-container hidden">
        <div class="weather-card">
          <h2 class="city"></h2>

          <img class="weather-icon" src="" alt="Weather icon" />

          <p class="temperature"></p>

          <div class="unit-toggle">
            <button class="unit-btn active" data-unit="celsius">&deg;C</button>
            <button class="unit-btn" data-unit="fahrenheit">&deg;F</button>
          </div>

          <p class="condition"></p>

          <div class="details"></div>

          <section class="forecast">
            <h3>5-Day Forecast</h3>
            <div class="forecast-list"></div>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="./src/index.js?v=20260521"></script>
  </body>
</html>
